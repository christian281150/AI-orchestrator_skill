# orchestration.toml - read by tools/orch.py (supervisor, preflight, hooks, board checks).
# Written by the setup session from docs/coordination/orchestration-config.md.
# Paths are relative to this file unless absolute. ~ and %VARS% / $VARS expand.

[project]
name = "{{PROJECT_NAME}}"
repo = "."
main_branch = "{{MAIN_BRANCH}}"
board = "docs/coordination/PROGRESS.md"
decisions = "docs/coordination/decisions-log.md"
session_prompt = "docs/coordination/SESSION-PROMPT.md"
ledgers = "docs/coordination/ledgers"
stop_file = "docs/coordination/STOP"
state_dir = "~/.agent-build/{{PROJECT_NAME}}"       # run state, logs, markers - OUTSIDE the repo
worktrees_dir = "../{{PROJECT_NAME}}-wt"             # one git worktree per lane
id_pattern = '^(W\d+-\d+|F\d+)$'                     # W<wave>-<n> items, F<n> fixes

[rounds]
window_minutes = 180          # a round refills lanes for this long, then lets running leads finish
max_round_minutes = 330       # hard cap - the ONLY time a round is ever killed
pause_seconds = 30
reprobe_minutes = 15          # how often to re-check a provider that hit its limit
push_after_round = true
fallback_when_limited = true  # coordinator limited -> build-only providers keep building approved plans
max_identical_failures = 3    # same failure N times in a row -> stop and write BLOCKED.txt

[git]
author_name = "{{AUTHOR_NAME}}"
author_email = "{{AUTHOR_EMAIL}}"
# Lines the commit-msg hook rejects (AI attribution trailers of the providers you use).
# Empty the list if you WANT AI attribution lines.
forbid_trailers = ["Co-Authored-By: Claude", "Generated with [Claude", "Claude-Session:", "Co-authored-by: Codex", "Co-authored-by: Gemini"]

[safety]
forbid_paths = ["*.har", "*.pem", "*.key", ".env", ".env.*", "data/**", "secrets/**"]
required_env = []             # names only, e.g. ["DB_PASSWORD_APP"]; values are never printed
redact_terms = []             # your server names, domains, client names - blocked from commits and outgoing prompts

[keeper]                      # `orch.py keeper`, run by the OS scheduler every interval_minutes
interval_minutes = 10
queue_low_watermark = 5       # approved plans waiting; below this, planners are topped up
cloud_steady = 1              # cloud planners while the lead provider has capacity
cloud_accelerate_max = 3      # cloud sessions in total once the lead provider is limited
handback_below_pct = 50       # lead usage (5-hour) back below this -> extra cloud sessions hand back
cloud_credit_floor = 5        # never launch a cloud session below this credit
idle_planning = true          # an idle build provider may plan one safe open item (lead reconciles it)
unsafe_lanes = ["db", "infra", "security"]   # never auto-planned by a non-lead provider

# ---------------------------------------------------------------- providers
# kind: local (CLI on this machine) | cloud (remote sessions, usually a separate credit) | chat (copy-paste desk)
# usage_command: optional; must print JSON like {"five_hour_pct": 42, "weekly_pct": 10, "credit_left": 233.5}.
#   Ready-made readers: ["{python}", "tools/orch.py", "usage", "claude" | "codex"] ({python} = the Python running orch.py).
#   A reader that cannot understand the tool's record makes the provider start NO new work (usage_fail_closed = true)
#   until it reads again; "nothing recorded yet" is not a block. `preflight` shows the live reading.
# Provider-neutral: add any CLI agent. priority: lower = preferred. roles: coordinator | plan | review | build | merge
# The examples below (Claude lead, Codex + Gemini builders) are one setup; replace them with the owner's tools.
# {prompt_file} {round_id} ({prompt} = full text) in round_command; {brief_file} ({brief} = full text) {worktree} {item} {branch} in build_command.
# Verify every command against your installed CLI version (`<cli> --help`) - flags change.

[[providers]]
name = "claude"
priority = 1
roles = ["coordinator", "plan", "review", "build", "merge"]
# Prompts are passed as a FILE reference: long command lines fail on Windows (~8k chars in some shells).
round_command = ["claude", "-p", "Read {prompt_file} completely and follow it. It is your full instruction for this round.", "--model", "opus"]
build_command = ["claude", "-p", "Read {brief_file} completely and carry it out in {worktree} on branch {branch}.", "--model", "sonnet"]
limit_patterns = ["usage limit reached", "limit will reset", "resets? (?:at )?\\d", "you've hit your limit"]
# Reads the allowance from the statusline capture (see docs/CONFIGURATION.md) and from stream-json round logs.
usage_command = ["{python}", "tools/orch.py", "usage", "claude"]
max_parallel = 4
[providers.env]
CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS = "30"              # helper cap per round - raise only after measuring RAM
CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS = "14400000"        # print mode otherwise stops background work early

[[providers]]
name = "codex"
priority = 2
roles = ["build"]                                        # builds approved plans only; never merges
build_command = ["codex", "exec", "--cd", "{worktree}", "--full-auto", "Read {brief_file} completely and carry it out on branch {branch}."]
plan_command = ["codex", "exec", "--cd", "{worktree}", "--full-auto", "Plan item {item} only: write docs/coordination/ledgers/{item}/plan.md (first line: Authored-by: codex) and build-brief.md on branch {branch}. Do not implement."]
native_limit = "codex_rollout"                           # its own usage record decides, not log text
native_limit_threshold = 97
usage_command = ["{python}", "tools/orch.py", "usage", "codex"]   # both windows + reset times for the keeper
max_parallel = 5
strip_env = []                                           # e.g. ["DB_PASSWORD_ADMIN", "CLOUD_API_TOKEN"]

[[providers]]
name = "gemini"
priority = 3
enabled = false                                          # optional third provider, build-only
roles = ["build"]
build_command = ["gemini", "-p", "Read {brief_file} completely and carry it out in {worktree} on branch {branch}."]
limit_patterns = ["quota exceeded", "rate limit"]
max_parallel = 2

[[providers]]
name = "cloud"
kind = "cloud"                                           # remote sessions on their own credit - planning only
priority = 4
enabled = false                                          # turn on once the git host is connected to the cloud service
roles = ["plan"]
plan_command = ["claude", "--cloud", "Plan these board items, one ledger each (first line of plan.md: Authored-by: cloud): {todo}. Check docs/coordination/cloud-handback.txt before each item; if it says HANDBACK, finish the current item and stop."]
usage_command = []                                       # e.g. a script printing {"credit_left": 233.5}
max_parallel = 3
