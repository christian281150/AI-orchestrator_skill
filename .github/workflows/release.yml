name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the build provenance
      attestations: write    # publish the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pytest && git config --global user.email ci@example.com && git config --global user.name ci
      - run: python -m pytest
      - name: Build skill zip (upload this in Claude apps) and checksum
        run: |
          cd skills && zip -r ../build-orchestration-setup.zip build-orchestration-setup -x "*/__pycache__/*" && cd ..
          sha256sum build-orchestration-setup.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build-orchestration-setup.zip
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build-orchestration-setup.zip
            SHA256SUMS.txt
          generate_release_notes: true
